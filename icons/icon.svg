      <path d="M2.7 6.62h6.6" stroke="#FFF7DA" stroke-opacity=".75" stroke-width=".3" stroke-linecap="round"/>
    </g>
    <ellipse id="glanz" cx="7.7" cy="3.9" rx="1.05" ry=".6" transform="rotate(-35 7.7 3.9)" fill="#FFFFFF" fill-opacity=".9"/>
    <linearGradient id="kappe-blende" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="64">
      <stop offset=".2" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="kappe-maske"><rect width="512" height="64" fill="url(#kappe-blende)"/></mask>
  </defs>

