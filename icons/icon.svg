  <!-- Streckenblitz: Pixelstraße in der Abenddämmerung mit Blitz, im Beschlag der Werkstatt (Platte in Asphaltblau,
       eckiger Rahmen, vier Weißgold-Schrauben in verschiedenen Winkeln, Kappe in gedämpftem Signalorange).
       Die Straße ist aus ganzen Pixelzeilen gebaut (alt), Blitz und Licht sind glatt (neu). Schatten nach links unten. -->
  <defs>
    <linearGradient id="platte" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#222b3f"/>
      <stop offset=".5" stop-color="#161c2b"/>
      <stop offset="1" stop-color="#0d111b"/>
    </linearGradient>
    <clipPath id="rund"><rect width="512" height="512" rx="104"/></clipPath>
    <clipPath id="fenster"><rect x="40" y="40" width="432" height="432"/></clipPath>
    <linearGradient id="himmel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151530"/>
      <stop offset=".55" stop-color="#2e2040"/>
      <stop offset=".85" stop-color="#5a3040"/>
      <stop offset="1" stop-color="#7c4238"/>
    </linearGradient>
    <radialGradient id="schein" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#c4794a" stop-opacity=".45"/>
      <stop offset="1" stop-color="#c4794a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blitz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F6EBC8"/>
      <stop offset=".5" stop-color="#E9B57C"/>
      <stop offset="1" stop-color="#D58A4E"/>
    </linearGradient>
    <filter id="weich" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <radialGradient id="sS" cx="42%" cy="58%" r="50%"><stop offset="55%" stop-opacity=".6"/><stop offset="100%" stop-opacity="0"/></radialGradient>
    <radialGradient id="sK" cx="66%" cy="30%" r="78%"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".2" stop-color="#FFFCEE"/><stop offset=".5" stop-color="#F1E4BC"/><stop offset=".8" stop-color="#C4A964"/><stop offset="1" stop-color="#7A6226"/></radialGradient>
    <linearGradient id="sM" x1="1" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8A6A22" stop-opacity=".55"/><stop offset=".5" stop-color="#FFF3C4" stop-opacity="0"/><stop offset="1" stop-color="#FFFBEA" stop-opacity=".7"/></linearGradient>
    <g id="schraube">
      <circle cx="5.1" cy="6.9" r="5" fill="url(#sS)"/>
      <circle cx="6" cy="6" r="4.3" fill="url(#sK)"/>
      <circle cx="6" cy="6" r="4.3" fill="none" stroke="#553E0C" stroke-opacity=".6" stroke-width=".45"/>
      <circle cx="6" cy="6" r="2.9" fill="none" stroke="url(#sM)" stroke-width=".5"/>
    </g>
    <g id="schlitz">
